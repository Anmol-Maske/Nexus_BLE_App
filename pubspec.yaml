name: nexus
description: BLE based IOT App

publish_to: 'none'

# Version of your app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  permission_handler: ^10.4.5
  provider: ^6.1.1
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.5.0
  url_launcher: ^6.3.0
  flutter_blue_plus: ^1.35.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png